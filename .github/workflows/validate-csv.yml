name: Validate CSV

on:
  pull_request:
    paths:
      - "climbing_centers.csv"
      - "opening_hours.csv"
      - "scripts/csv_to_json.py"
      - "scripts/hours_to_json.py"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate centers (does not commit)
        run: python scripts/csv_to_json.py

      - name: Validate hours (does not commit)
        run: python scripts/hours_to_json.py
